name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Compile and test
        run: |
          python -m py_compile $(find src tests alembic -type f -name '*.py' -print)
          pytest -q
      - name: Build runtime image
        run: docker build --tag ontoportal-agent:ci .
      - name: Smoke runtime image
        run: |
          docker run --rm --entrypoint sh ontoportal-agent:ci -ec '
            git --version
            test "$(opencode --version)" = "1.15.12"
            python -c "import ontoportal_agent.server"
          '

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoportal-agent"
version = "0.1.0"
description = "An interactive LangGraph/LangChain agent for OntoPortal ontology maintenance"
requires-python = ">=3.11"
authors = [
  { name = "OntoPortal Team" }
]
dependencies = [
  "langchain>=1.3.2",
  "langgraph>=1.2.0",
  "langchain-openai>=0.1.0",
  "langchain-anthropic>=0.3.0",
  "deepagents>=0.6.4,<0.7.0",
  "langchain-community>=0.3.0",
  "rdflib>=6.3.2",
  "owlready2>=0.46",
  "requests>=2.32.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "typer>=0.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "cryptography>=43.0.0",
  "psycopg[binary]>=3.2.0",
  "google-auth>=2.38.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ontoportal-agent = "ontoportal_agent.cli:app"
ontoportal-agent-api = "ontoportal_agent.server:main"
